name: Test PR
"on": pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  install-and-test:
    name: 🛠️ Install & Test
    runs-on: ubuntu-latest

    steps:
      - name: 🗜️ Checkout
        uses: actions/checkout@v7

      - name: 🗜️ Setup node version
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: 🗜️ Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🗜️ Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: 🛠️ Install
        uses: ./.github/actions/cached-deps

      - name: 🛠️ Clean temporary files
        run: bun run clean

      - name: ✅ Validate
        run: bun run validate

      - name: 🛠️ Build coverage tests
        run: bun run coverage:build

      - name: 🧪 Generate coverage
        uses: ./.github/actions/generate-coverage

      - name: 📊 Report coverage
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/report-pr
        with:
          coverage-file: coverage/merged/kcov-merged/cobertura.xml

      - name: 🛠️ Build cross-platform package
        run: bun run package

  package-smoke-test:
    name: 📦 Package Smoke Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 🗜️ Checkout
        uses: actions/checkout@v7

      - name: 🗜️ Setup node version
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: 🗜️ Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: 🗜️ Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: 🛠️ Install
        uses: ./.github/actions/cached-deps
        with:
          caching: "false"

      - name: 🛠️ Build cross-platform package
        run: bun run package

      - name: 🧪 Run packaged CLI
        run: node dist/bin/package-version-info.js --version
